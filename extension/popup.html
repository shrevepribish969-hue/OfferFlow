<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
      color: #334155;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #4338ca;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      display: none;
    }
    .success { color: #059669; }
    .error { color: #e11d48; }
  </style>
</head>
<body>
  <h2>✨ OfferFlow Clipper</h2>
  <p>一键提取当前网页的职位描述 (JD)，并发送到 OfferFlow 的海投线索池中进行 AI 初筛。</p>
  <button id="clipBtn">提取并发送至 OfferFlow</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
