<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OfferFlow 求职助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo">OF</div>
    <div>
      <h1>OfferFlow 求职助手</h1>
      <p>投递信息，一键完成</p>
    </div>
  </header>

  <main>
    <section class="card primary-card">
      <div class="card-heading">
        <div>
          <h2>一键填写当前页面</h2>
          <p id="profileSummary">正在读取个人资料…</p>
        </div>
        <span class="spark">✦</span>
      </div>
      <button id="fillBtn" class="button primary" type="button">智能识别并填写</button>
      <button id="optionsBtn" class="button secondary" type="button">编辑我的资料</button>
    </section>

    <section class="card compact-card">
      <div>
        <h2>收藏当前职位</h2>
        <p>提取页面 JD 到 OfferFlow 线索池</p>
      </div>
      <button id="clipBtn" class="icon-button" type="button" title="收藏当前职位">＋</button>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <p class="privacy">资料仅保存在当前浏览器中，不会由扩展上传。</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
