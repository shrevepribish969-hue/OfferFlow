services:
  - type: web
    name: offerflow-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r runtime/requirements-render.txt
    startCommand: uvicorn runtime.api.api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - fromGroup: offerflow-auth
      - key: DATABASE_URL
        fromDatabase:
          name: offerflow-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: OFFERFLOW_ENABLE_SEMANTIC_RAG
        value: "0"
      - key: PYTHON_VERSION
        value: 3.12.8

  - type: web
    name: offerflow-web
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - fromGroup: offerflow-auth
      - key: BACKEND_URL
        fromService:
          type: web
          name: offerflow-api
          property: hostport
      - key: NODE_VERSION
        value: 22.18.0

databases:
  - name: offerflow-db
    plan: free
    region: singapore
    databaseName: offerflow
    user: offerflow
    ipAllowList: []

envVarGroups:
  - name: offerflow-auth
    envVars:
      - key: APP_USERNAME
        value: offerflow
      - key: APP_PASSWORD
        generateValue: true
